name: cleanup-browser-security-review-helper

on:
  push:
    branches:
      - chatgpt/autonomous-dev-loop

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/autonomous-dev-loop
      - name: Remove temporary write-enabled review helpers
        run: |
          git rm -f .github/workflows/apply-browser-security-review-repair.yml .github/workflows/cleanup-browser-security-review-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove browser security review helpers"
          git push origin HEAD:chatgpt/autonomous-dev-loop
