name: production-action-request

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-action-request
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_3LfEMNVsAEbXKLoCrnzXQzrF
  ACTION_PROJECT_ID: prj_80jo2dodxOmSSvX6muUc7Tc7wIo1
  ACTION_URL: https://ual-gpt-action-api.vercel.app
  REQUEST_MAX_BYTES: '4096'
  PLAN_MAX_BYTES: '60000'
  PR_HEAD_RETRY_ATTEMPTS: '6'
  PR_HEAD_RETRY_DELAY_SECONDS: '1'

jobs:
  apply-request:
    if: >-
      github.event.sender.login == 'JOHNNYMACONNY' &&
      github.event.issue.user.login == 'JOHNNYMACONNY' &&
      github.event.issue.title == 'UAL Production Action Request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      REQUEST_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Validate bounded owner request pointer
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_BODY" > /tmp/request.json
          bytes=$(wc -c < /tmp/request.json | tr -d ' ')
          [ "$bytes" -le "$REQUEST_MAX_BYTES" ] || { echo "::error::Request exceeds $REQUEST_MAX_BYTES bytes"; exit 1; }
          jq -e '
            .requestVersion == 1 and
            (.repository | type == "string" and test("^JOHNNYMACONNY/[A-Za-z0-9_.-]+$")) and
            (.pullRequest | type == "number" and . >= 1 and floor == .) and
            (.branch | type == "string" and test("^chatgpt\\/")) and
            (.expectedHead | type == "string" and test("^[0-9a-fA-F]{40}$")) and
            (.planRef | type == "string" and test("^[0-9a-fA-F]{40}$")) and
            (.planBlobSha | type == "string" and test("^[0-9a-fA-F]{40}$")) and
            (.planPath | type == "string" and startswith(".ual/action-requests/") and length <= 1024 and (contains("..") | not) and endswith(".json"))
          ' /tmp/request.json > /dev/null

      - name: Resolve Production Action bearer without exposing it
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo '::error::VERCEL_TOKEN is unavailable'; exit 1; }
          echo "::add-mask::$VERCEL_TOKEN"
          api='https://api.vercel.com'
          auth="Authorization: Bearer $VERCEL_TOKEN"
          status=$(curl -sS -o /tmp/action-env.json -w '%{http_code}' -H "$auth" \
            "$api/v10/projects/$ACTION_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID")
          [ "$status" = '200' ] || { echo "::error::Unable to list Production Action env metadata (HTTP $status)"; exit 1; }
          env_id=$(jq -r '[.envs[] | select(.key == "UAL_ACTION_API_KEY" and ((.gitBranch // "") == "") and ((.target // []) | index("production")))] | sort_by(.updatedAt // .createdAt // 0) | last | .id // empty' /tmp/action-env.json)
          [[ "$env_id" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::Production UAL_ACTION_API_KEY metadata is missing'; exit 1; }
          status=$(curl -sS -o /tmp/action-key.json -w '%{http_code}' -H "$auth" \
            "$api/v1/projects/$ACTION_PROJECT_ID/env/$env_id?teamId=$VERCEL_TEAM_ID")
          [ "$status" = '200' ] || { echo "::error::Unable to resolve Production Action bearer (HTTP $status)"; exit 1; }
          action_key=$(jq -r 'if (.value | type) == "string" then .value else "" end' /tmp/action-key.json)
          [ -n "$action_key" ] || { echo '::error::Production Action bearer resolved empty'; exit 1; }
          echo "::add-mask::$action_key"
          echo "ACTION_KEY=$action_key" >> "$GITHUB_ENV"
          rm -f /tmp/action-env.json /tmp/action-key.json

      - name: Pin exact pull-request head through Production Action
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r '.repository' /tmp/request.json)
          pr=$(jq -r '.pullRequest' /tmp/request.json)
          branch=$(jq -r '.branch' /tmp/request.json)
          expected=$(jq -r '.expectedHead' /tmp/request.json)
          status=$(curl -sS -G -o /tmp/pr-before.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACTION_KEY" \
            --data-urlencode "repository=$repository" \
            --data-urlencode "number=$pr" \
            "$ACTION_URL/github/pull-request")
          [ "$status" = '200' ] || { echo "::error::Production Action PR read failed (HTTP $status)"; cat /tmp/pr-before.json; exit 1; }
          [ "$(jq -r '.state' /tmp/pr-before.json)" = 'open' ] || { echo '::error::Target PR is not open'; exit 1; }
          [ "$(jq -r '.merged' /tmp/pr-before.json)" = 'false' ] || { echo '::error::Target PR is already merged'; exit 1; }
          [ "$(jq -r '.head.ref' /tmp/pr-before.json)" = "$branch" ] || { echo '::error::Target PR branch does not match request'; exit 1; }
          [ "$(jq -r '.head.sha' /tmp/pr-before.json)" = "$expected" ] || { echo '::error::Target PR head moved; request is stale'; exit 1; }

      - name: Load and validate immutable target-repo repair plan
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r '.repository' /tmp/request.json)
          plan_ref=$(jq -r '.planRef' /tmp/request.json)
          plan_path=$(jq -r '.planPath' /tmp/request.json)
          expected_blob=$(jq -r '.planBlobSha' /tmp/request.json)
          status=$(curl -sS -G -o /tmp/plan-file.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACTION_KEY" \
            --data-urlencode "repository=$repository" \
            --data-urlencode "path=$plan_path" \
            --data-urlencode "ref=$plan_ref" \
            "$ACTION_URL/github/file")
          [ "$status" = '200' ] || { echo "::error::Production Action plan read failed (HTTP $status)"; cat /tmp/plan-file.json; exit 1; }
          actual_blob=$(jq -r '.blobSha // empty' /tmp/plan-file.json)
          [ "$actual_blob" = "$expected_blob" ] || { echo '::error::Repair plan blob does not match immutable request pointer'; exit 1; }
          jq -r '.content' /tmp/plan-file.json > /tmp/plan.json
          bytes=$(wc -c < /tmp/plan.json | tr -d ' ')
          [ "$bytes" -le "$PLAN_MAX_BYTES" ] || { echo "::error::Repair plan exceeds $PLAN_MAX_BYTES bytes"; exit 1; }
          jq -e '
            .planVersion == 1 and
            (.operations | type == "array" and length >= 1 and length <= 4) and
            ([.operations[].path] | unique | length) == (.operations | length) and
            all(.operations[];
              (.path | type == "string" and length >= 1 and length <= 1024 and (startswith("/") | not) and (contains("..") | not)) and
              (.message | type == "string" and length >= 1 and length <= 300) and
              (.replacements | type == "array" and length >= 1 and length <= 8) and
              all(.replacements[];
                (.old | type == "string" and length >= 1) and
                (.new | type == "string") and
                (.old != .new)
              )
            )
          ' /tmp/plan.json > /dev/null

      - name: Preflight all exact replacements before any write
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r '.repository' /tmp/request.json)
          branch=$(jq -r '.branch' /tmp/request.json)
          pr=$(jq -r '.pullRequest' /tmp/request.json)
          expected=$(jq -r '.expectedHead' /tmp/request.json)
          operation_count=$(jq -r '.operations | length' /tmp/plan.json)

          for ((i=0; i<operation_count; i++)); do
            jq ".operations[$i]" /tmp/plan.json > "/tmp/op-$i.json"
            path=$(jq -r '.path' "/tmp/op-$i.json")
            status=$(curl -sS -G -o "/tmp/file-$i-before.json" -w '%{http_code}' \
              -H "Authorization: Bearer $ACTION_KEY" \
              --data-urlencode "repository=$repository" \
              --data-urlencode "path=$path" \
              --data-urlencode "ref=$branch" \
              "$ACTION_URL/github/file")
            [ "$status" = '200' ] || { echo "::error::Production Action file read failed for $path (HTTP $status)"; cat "/tmp/file-$i-before.json"; exit 1; }
            jq -r '.content' "/tmp/file-$i-before.json" > "/tmp/content-$i.txt"
            blob_sha=$(jq -r '.blobSha // empty' "/tmp/file-$i-before.json")
            [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No exact blob SHA for $path"; exit 1; }
            printf '%s' "$blob_sha" > "/tmp/blob-$i.sha"

            OP_INDEX="$i" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          i = os.environ['OP_INDEX']
          op = json.loads(Path(f'/tmp/op-{i}.json').read_text())
          content_path = Path(f'/tmp/content-{i}.txt')
          content = content_path.read_text()
          for replacement in op['replacements']:
              old = replacement['old']
              new = replacement['new']
              old_count = content.count(old)
              if old_count != 1:
                  raise SystemExit(f"expected exactly one old fragment in {op['path']}, found {old_count}")
              content = content.replace(old, new, 1)
          content_path.write_text(content)
          PY
          done

          status=$(curl -sS -G -o /tmp/pr-after-preflight.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACTION_KEY" \
            --data-urlencode "repository=$repository" \
            --data-urlencode "number=$pr" \
            "$ACTION_URL/github/pull-request")
          [ "$status" = '200' ] || { echo "::error::Production Action PR re-pin failed (HTTP $status)"; exit 1; }
          [ "$(jq -r '.head.sha' /tmp/pr-after-preflight.json)" = "$expected" ] || { echo '::error::PR head moved during relay execution'; exit 1; }

      - name: Write preflighted replacements through Production Action
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r '.repository' /tmp/request.json)
          branch=$(jq -r '.branch' /tmp/request.json)
          pr=$(jq -r '.pullRequest' /tmp/request.json)
          operation_count=$(jq -r '.operations | length' /tmp/plan.json)
          expected_current=$(jq -r '.expectedHead' /tmp/request.json)
          final_commit=''

          wait_for_pr_head() {
            local repository="$1"
            local pr="$2"
            local expected_head="$3"
            local output_path="$4"
            local attempt status actual_head=''
            for ((attempt=1; attempt<=PR_HEAD_RETRY_ATTEMPTS; attempt++)); do
              status=$(curl -sS -G -o "$output_path" -w '%{http_code}' \
                -H "Authorization: Bearer $ACTION_KEY" \
                --data-urlencode "repository=$repository" \
                --data-urlencode "number=$pr" \
                "$ACTION_URL/github/pull-request")
              [ "$status" = '200' ] || { echo "::error::Production Action PR head read failed (HTTP $status)"; return 1; }
              actual_head=$(jq -r '.head.sha // empty' "$output_path")
              if [ "$actual_head" = "$expected_head" ]; then
                return 0
              fi
              if [ "$attempt" -lt "$PR_HEAD_RETRY_ATTEMPTS" ]; then
                sleep "$PR_HEAD_RETRY_DELAY_SECONDS"
              fi
            done
            echo "::error::timed out waiting for PR head $expected_head; last observed $actual_head"
            return 1
          }

          for ((i=0; i<operation_count; i++)); do
            wait_for_pr_head "$repository" "$pr" "$expected_current" /tmp/pr-before-write.json || exit 1

            path=$(jq -r '.path' "/tmp/op-$i.json")
            message=$(jq -r '.message' "/tmp/op-$i.json")
            blob_sha=$(cat "/tmp/blob-$i.sha")
            jq -n \
              --arg repository "$repository" \
              --arg path "$path" \
              --arg branch "$branch" \
              --arg message "$message" \
              --rawfile content "/tmp/content-$i.txt" \
              --arg sha "$blob_sha" \
              '{repository:$repository,path:$path,branch:$branch,message:$message,content:$content,sha:$sha}' \
              > /tmp/write-request.json

            status=$(curl -sS -o /tmp/write-response.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $ACTION_KEY" \
              -H 'Content-Type: application/json' \
              --data @/tmp/write-request.json \
              "$ACTION_URL/github/file")
            if [ "$status" != '200' ] && [ "$status" != '201' ]; then
              echo "::error::Production Action file write failed for $path (HTTP $status)"
              cat /tmp/write-response.json
              exit 1
            fi
            final_commit=$(jq -r '.commitSha // empty' /tmp/write-response.json)
            [[ "$final_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Action write returned no exact commit SHA for $path"; exit 1; }
            expected_current="$final_commit"
          done

          [ -n "$final_commit" ] || { echo '::error::No write operation completed'; exit 1; }
          echo "final_commit=$final_commit" >> "$GITHUB_OUTPUT"

      - name: Verify final PR head through Production Action
        shell: bash
        env:
          FINAL_COMMIT: ${{ steps.apply.outputs.final_commit }}
        run: |
          set -euo pipefail
          repository=$(jq -r '.repository' /tmp/request.json)
          pr=$(jq -r '.pullRequest' /tmp/request.json)

          wait_for_pr_head() {
            local repository="$1"
            local pr="$2"
            local expected_head="$3"
            local output_path="$4"
            local attempt status actual_head=''
            for ((attempt=1; attempt<=PR_HEAD_RETRY_ATTEMPTS; attempt++)); do
              status=$(curl -sS -G -o "$output_path" -w '%{http_code}' \
                -H "Authorization: Bearer $ACTION_KEY" \
                --data-urlencode "repository=$repository" \
                --data-urlencode "number=$pr" \
                "$ACTION_URL/github/pull-request")
              [ "$status" = '200' ] || { echo "::error::Production Action final PR head read failed (HTTP $status)"; return 1; }
              actual_head=$(jq -r '.head.sha // empty' "$output_path")
              if [ "$actual_head" = "$expected_head" ]; then
                return 0
              fi
              if [ "$attempt" -lt "$PR_HEAD_RETRY_ATTEMPTS" ]; then
                sleep "$PR_HEAD_RETRY_DELAY_SECONDS"
              fi
            done
            echo "::error::timed out waiting for PR head $expected_head; last observed $actual_head"
            return 1
          }

          wait_for_pr_head "$repository" "$pr" "$FINAL_COMMIT" /tmp/pr-after.json || exit 1

      - name: Record non-secret success on request issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_COMMIT: ${{ steps.apply.outputs.final_commit }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          repository=$(jq -r '.repository' /tmp/request.json)
          pr=$(jq -r '.pullRequest' /tmp/request.json)
          jq -n \
            --arg body "Production Action request PASS\n\nTarget: $repository PR #$pr\nFinal exact head: $FINAL_COMMIT" \
            '{body:$body}' > /tmp/comment.json
          status=$(curl -sS -o /tmp/comment-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data @/tmp/comment.json \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments")
          [ "$status" = '201' ] || { echo "::error::Could not record request success (HTTP $status)"; exit 1; }
