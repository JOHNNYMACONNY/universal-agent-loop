name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apply-reviewed-recovery-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/autonomous-dev-loop'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/autonomous-dev-loop
      - name: Apply patch when marker exists
        run: |
          if [ ! -f apps/game-browser-mcp/.apply-reviewed-recovery-patch ]; then
            echo "No repair marker; nothing to do"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          worker_path = Path('apps/game-browser-mcp/sandbox/worker.mjs')
          worker = worker_path.read_text()
          needle = "import { spawnSync } from 'node:child_process';\n"
          if "from './persistent-lock.mjs'" not in worker:
              if needle not in worker: raise SystemExit('worker import anchor missing')
              worker = worker.replace(needle, needle + "import { withPersistentLock } from './persistent-lock.mjs';\n", 1)
          updated = re.sub(
              r"function sleep\(ms\) \{ Atomics\.wait\(new Int32Array\(new SharedArrayBuffer\(4\)\), 0, 0, ms\); \}\nfunction withLock\(fn\) \{[\s\S]*?\n\}\nfunction workerError",
              "function workerError",
              worker,
              count=1,
          )
          if updated == worker and 'function withLock' in worker: raise SystemExit('worker lock block replacement failed')
          worker = updated.replace("try { withLock(dispatch); }", "try { withPersistentLock(lockPath, dispatch); }")
          if "withPersistentLock(lockPath, dispatch)" not in worker: raise SystemExit('worker dispatch replacement failed')
          worker_path.write_text(worker)

          tools_path = Path('apps/game-browser-mcp/src/tools/index.ts')
          tools = tools_path.read_text()
          old = """  async function sessionEnd(rawInput: unknown) {
    const input = SessionSchema.parse(rawInput);
    const owned = await ownedRecord(input.session_id);
    if (owned.session.lifecycle === 'ENDING') return { session_id: input.session_id, ended: true };
    await deps.sessions.end(input.session_id);
    try { await deps.browser.releaseHeldInput(owned.ref); } catch {}
    try { await deps.sessions.updateHeldInput(input.session_id, [], []); } catch {}
    try { await deps.browser.end(owned.ref); } catch {}
    return { session_id: input.session_id, ended: true };
  }
"""
          new = """  async function sessionEnd(rawInput: unknown) {
    const input = SessionSchema.parse(rawInput);
    let owned: { session: SessionRecord; ref: BrowserSessionRef };
    try {
      owned = await ownedRecord(input.session_id);
    } catch (error) {
      if (error instanceof RuntimeError && (error.code === 'SESSION_NOT_FOUND' || error.code === 'SESSION_EXPIRED')) {
        return { session_id: input.session_id, ended: true };
      }
      throw error;
    }
    if (owned.session.lifecycle !== 'ENDING') await deps.sessions.end(input.session_id);
    try { await deps.browser.releaseHeldInput(owned.ref); } catch {}
    try { await deps.sessions.updateHeldInput(input.session_id, [], []); } catch {}
    try { await deps.browser.end(owned.ref); } catch {}
    return { session_id: input.session_id, ended: true };
  }
"""
          if old not in tools: raise SystemExit('sessionEnd anchor missing')
          tools_path.write_text(tools.replace(old, new, 1))

          browser_path = Path('apps/game-browser-mcp/src/browser/vercel-sandbox-browser.ts')
          browser = browser_path.read_text()
          old = """  async end(session: BrowserSessionRef): Promise<void> {
    try {
      const handle = await this.#factory.get(session.sandboxId);
      if (handle.currentSessionStatus() === 'running') await this.#worker(handle, { type: 'end', session_id: session.logicalSessionId });
      await handle.stop();
      await handle.delete();
    } catch {
      // End is idempotent. A missing/dead sandbox is already ended from the caller's perspective.
    }
  }
"""
          new = """  async end(session: BrowserSessionRef): Promise<void> {
    let handle: SandboxHandle;
    try { handle = await this.#factory.get(session.sandboxId); }
    catch { return; }
    if (handle.currentSessionStatus() === 'running') {
      try { await this.#worker(handle, { type: 'end', session_id: session.logicalSessionId }); } catch {}
      try { await handle.stop(); } catch {}
    }
    try { await handle.delete(); } catch {}
  }
"""
          if old not in browser: raise SystemExit('browser end anchor missing')
          browser_path.write_text(browser.replace(old, new, 1))

          snapshot_path = Path('apps/game-browser-mcp/scripts/create-browser-snapshot.ts')
          snapshot = snapshot_path.read_text()
          old = "const workerUrl = new URL('../sandbox/worker.mjs', import.meta.url);\nconst worker = await readFile(workerUrl);"
          new = "const workerUrl = new URL('../sandbox/worker.mjs', import.meta.url);\nconst lockUrl = new URL('../sandbox/persistent-lock.mjs', import.meta.url);\nconst [worker, persistentLock] = await Promise.all([readFile(workerUrl), readFile(lockUrl)]);"
          if old not in snapshot: raise SystemExit('snapshot read anchor missing')
          snapshot = snapshot.replace(old, new, 1)
          old = "await sandbox.writeFiles([{ path: '/vercel/sandbox/worker.mjs', content: worker, mode: 0o755 }]);"
          new = "await sandbox.writeFiles([\n    { path: '/vercel/sandbox/worker.mjs', content: worker, mode: 0o755 },\n    { path: '/vercel/sandbox/persistent-lock.mjs', content: persistentLock, mode: 0o644 },\n  ]);"
          if old not in snapshot: raise SystemExit('snapshot write anchor missing')
          snapshot_path.write_text(snapshot.replace(old, new, 1))
          PY
          rm apps/game-browser-mcp/.apply-reviewed-recovery-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game-browser-mcp
          git commit -m "fix: harden persistent sandbox recovery"
          git push origin HEAD:chatgpt/autonomous-dev-loop

  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  game-browser-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/game-browser-mcp/package-lock.json
      - run: npm ci --prefix apps/game-browser-mcp --no-audit --no-fund
      - run: npm test --prefix apps/game-browser-mcp
      - run: npm run typecheck --prefix apps/game-browser-mcp
      - run: npm run build --prefix apps/game-browser-mcp
