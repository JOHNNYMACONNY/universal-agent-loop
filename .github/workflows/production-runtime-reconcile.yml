name: production-runtime-reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-runtime-reconcile.yml'
      - '.github/workflows/game-browser-mcp-bootstrap.yml'
      - 'apps/game-browser-mcp/**'
      - 'apps/gpt-action-api/**'
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with the existing manual Action Production mutator so environment
  # changes and stable-alias deployment updates cannot race each other.
  group: gpt-action-api-production
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_3LfEMNVsAEbXKLoCrnzXQzrF
  VERCEL_TEAM_SLUG: johnny-maconnys-projects
  BROWSER_PROJECT_ID: prj_bU062HqgwiUYUtMuX4nRN0GpXRd9
  ACTION_PROJECT_ID: prj_80jo2dodxOmSSvX6muUc7Tc7wIo1
  BROWSER_PRODUCTION_URL: https://ual-game-browser-mcp.vercel.app
  ACTION_PRODUCTION_URL: https://ual-gpt-action-api.vercel.app
  TARGET_REPOSITORY_OWNER: JOHNNYMACONNY
  TARGET_REPOSITORY_NAME: universal-agent-loop
  AGENT_BROWSER_VERSION: 0.34.0
  EVIDENCE_PATH: production-runtime-reconcile-evidence.json

jobs:
  reconcile-production:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/game-browser-mcp/package-lock.json

      - name: Resolve exact canonical candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha=$(git rev-parse HEAD)
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Canonical main did not resolve to an exact Git SHA"
            exit 1
          fi
          [ "$candidate_sha" = "$GITHUB_SHA" ] || {
            echo "::error::Checked-out candidate does not match the immutable workflow trigger SHA"
            exit 1
          }
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Require Vercel bootstrap credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN repository secret is required for Production reconciliation"
            exit 1
          fi
          echo "::add-mask::$VERCEL_TOKEN"

      - name: Install browser runtime tooling
        run: npm ci --prefix apps/game-browser-mcp --no-audit --no-fund

      - name: Reconcile persistent Production configuration
        id: config
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth="Authorization: Bearer $VERCEL_TOKEN"
          browser_env=/tmp/browser-env.json
          action_env=/tmp/action-env.json
          browser_changed=0
          action_changed=0

          fetch_env() {
            local project_id="$1" output="$2" status
            status=$(curl -sS -o "$output" -w '%{http_code}' -H "$auth" \
              "$api/v10/projects/$project_id/env?decrypt=true&teamId=$VERCEL_TEAM_ID")
            if [ "$status" != '200' ]; then
              echo "::error::Unable to read Production environment metadata for $project_id (HTTP $status)"
              exit 1
            fi
          }

          latest_record() {
            local file="$1" key="$2"
            jq -c --arg key "$key" '
              [.envs[]
                | select(
                    .key == $key
                    and ((.gitBranch // "") == "")
                    and ((.target // []) | index("production"))
                  )
              ]
              | sort_by(.updatedAt // .createdAt // 0)
              | last // null
            ' "$file"
          }

          production_value() {
            local project_id="$1" file="$2" key="$3" record env_id value_file status env_type decrypted
            record=$(latest_record "$file" "$key")
            if [ "$record" = 'null' ]; then
              printf ''
              return 0
            fi
            env_id=$(jq -r '.id // empty' <<<"$record")
            if [[ ! "$env_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::Production environment metadata for $key in $project_id has no valid variable ID" >&2
              exit 1
            fi
            value_file=$(mktemp)
            status=$(curl -sS -o "$value_file" -w '%{http_code}' -H "$auth" \
              "$api/v1/projects/$project_id/env/$env_id?teamId=$VERCEL_TEAM_ID")
            if [ "$status" != '200' ]; then
              rm -f "$value_file"
              echo "::error::Unable to resolve Production value for $key in $project_id (HTTP $status)" >&2
              exit 1
            fi
            env_type=$(jq -r '.type // empty' "$value_file")
            decrypted=$(jq -r '.decrypted // false' "$value_file")
            if [ "$env_type" != 'plain' ] && [ "$decrypted" != 'true' ]; then
              rm -f "$value_file"
              echo "::error::Vercel did not confirm decrypted non-plain Production value for $key in $project_id" >&2
              exit 1
            fi
            jq -r 'if (.value | type) == "string" then .value else "" end' "$value_file"
            rm -f "$value_file"
          }

          production_present() {
            local file="$1" key="$2"
            [ "$(latest_record "$file" "$key")" != 'null' ]
          }

          upsert_env() {
            local project_id="$1" file="$2" key="$3" value="$4" kind="$5" change_scope="$6"
            local current='' body status
            if production_present "$file" "$key"; then
              current=$(production_value "$project_id" "$file" "$key")
              if [ "$current" = "$value" ]; then return 0; fi
            fi
            body=$(jq -n --arg key "$key" --arg value "$value" --arg type "$kind" \
              '{key:$key,value:$value,type:$type,target:["production"]}')
            status=$(curl -sS -o /tmp/env-upsert.json -w '%{http_code}' \
              -X POST "$api/v10/projects/$project_id/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
              -H "$auth" -H 'Content-Type: application/json' --data "$body")
            if [ "$status" != '200' ] && [ "$status" != '201' ]; then
              echo "::error::Failed to upsert $key for $project_id (HTTP $status)"
              jq -r '.error.code // empty, .error.message // empty' /tmp/env-upsert.json || true
              exit 1
            fi
            if [ "$change_scope" = browser ]; then browser_changed=1; else action_changed=1; fi
          }

          stable_secret() {
            local project_id="$1" file="$2" key="$3" value
            value=$(production_value "$project_id" "$file" "$key")
            if [ -z "$value" ]; then value=$(openssl rand -hex 32); fi
            echo "::add-mask::$value" >&2
            printf '%s' "$value"
          }

          fetch_env "$BROWSER_PROJECT_ID" "$browser_env"
          fetch_env "$ACTION_PROJECT_ID" "$action_env"

          # Protected Action credentials are read-only. This reconciler never upserts them
          # and never copies UAL_ACTION_API_KEY into GitHub workflow state. The bridge
          # smoke receives the actual deployed value only inside `vercel env run`.
          for protected in UAL_ACTION_API_KEY GITHUB_TOKEN GITHUB_CONTROL_TOKEN GITHUB_CONTROL_OWNERS; do
            if ! production_present "$action_env" "$protected"; then
              echo "::error::Protected Action Production credential/config $protected is missing"
              exit 1
            fi
          done

          registration_control=$(stable_secret "$BROWSER_PROJECT_ID" "$browser_env" REGISTRATION_CONTROL_TOKEN)
          registration_capability=$(stable_secret "$BROWSER_PROJECT_ID" "$browser_env" REGISTRATION_CAPABILITY_SECRET)
          owner_binding=$(stable_secret "$BROWSER_PROJECT_ID" "$browser_env" OWNER_BINDING_SECRET)

          bridge_token=$(production_value "$BROWSER_PROJECT_ID" "$browser_env" GPT_ACTION_BRIDGE_TOKEN)
          if [ -z "$bridge_token" ]; then bridge_token=$(production_value "$ACTION_PROJECT_ID" "$action_env" GAME_BROWSER_BRIDGE_TOKEN); fi
          if [ -z "$bridge_token" ]; then bridge_token=$(openssl rand -hex 32); fi
          echo "::add-mask::$bridge_token"

          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" VERCEL_API_TOKEN "$VERCEL_TOKEN" encrypted browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" VERCEL_TEAM_ID "$VERCEL_TEAM_ID" plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" TARGET_PROJECT_ID "$BROWSER_PROJECT_ID" plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" TARGET_REPOSITORY_OWNER "$TARGET_REPOSITORY_OWNER" plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" TARGET_REPOSITORY_NAME "$TARGET_REPOSITORY_NAME" plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" TARGET_ENTRY_PATH '/fixture/' plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" APPROVED_DEPLOYMENT_HOST_PATTERNS '*.vercel.app' plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" APPROVED_DEPENDENCY_HOSTS '' plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" APPROVED_REDIRECT_HOSTS '' plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" REGISTRATION_CONTROL_TOKEN "$registration_control" encrypted browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" REGISTRATION_CAPABILITY_SECRET "$registration_capability" encrypted browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" OWNER_BINDING_SECRET "$owner_binding" encrypted browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" PRINCIPAL_AUDIENCE 'game-browser-mcp' plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" GPT_ACTION_BRIDGE_TOKEN "$bridge_token" encrypted browser

          upsert_env "$ACTION_PROJECT_ID" "$action_env" GAME_BROWSER_RUNTIME_BASE_URL "$BROWSER_PRODUCTION_URL" plain action
          upsert_env "$ACTION_PROJECT_ID" "$action_env" GAME_BROWSER_BRIDGE_TOKEN "$bridge_token" encrypted action

          snapshot_fingerprint=$(
            {
              printf 'agent-browser=%s\n' "$AGENT_BROWSER_VERSION"
              sha256sum \
                apps/game-browser-mcp/sandbox/worker.mjs \
                apps/game-browser-mcp/sandbox/persistent-lock.mjs \
                apps/game-browser-mcp/scripts/create-browser-snapshot.ts
            } | sha256sum | awk '{print $1}'
          )
          snapshot_id=$(production_value "$BROWSER_PROJECT_ID" "$browser_env" AGENT_BROWSER_SNAPSHOT_ID)
          stored_fingerprint=$(production_value "$BROWSER_PROJECT_ID" "$browser_env" AGENT_BROWSER_SNAPSHOT_FINGERPRINT)
          snapshot_reusable=false

          if [[ "$snapshot_id" =~ ^snap_ ]] && [ "$stored_fingerprint" = "$snapshot_fingerprint" ]; then
            snapshot_status=$(curl -sS -o /tmp/snapshot.json -w '%{http_code}' -H "$auth" \
              "$api/v2/sandboxes/snapshots/$snapshot_id?teamId=$VERCEL_TEAM_ID")
            if [ "$snapshot_status" = '200' ]; then
              state=$(jq -r '.snapshot.status // empty' /tmp/snapshot.json)
              expires_at=$(jq -r '.snapshot.expiresAt // 0' /tmp/snapshot.json)
              now_ms=$(( $(date +%s) * 1000 ))
              refresh_before=$(( now_ms + 3 * 24 * 60 * 60 * 1000 ))
              if [ "$state" = 'created' ] && [[ "$expires_at" =~ ^[0-9]+$ ]] && [ "$expires_at" -gt "$refresh_before" ]; then
                snapshot_reusable=true
              fi
            fi
          fi

          if [ "$snapshot_reusable" != true ]; then
            oidc_status=$(curl -sS -o /tmp/oidc.json -w '%{http_code}' \
              -X POST "$api/v1/projects/$BROWSER_PROJECT_ID/token?teamId=$VERCEL_TEAM_ID" \
              -H "$auth" -H 'Content-Type: application/json' \
              --data '{"source":"github-actions:production-runtime-reconcile"}')
            if [ "$oidc_status" != '200' ]; then
              echo "::error::Unable to mint project OIDC token for Sandbox snapshot creation (HTTP $oidc_status)"
              exit 1
            fi
            oidc_token=$(jq -r '.token // empty' /tmp/oidc.json)
            [ -n "$oidc_token" ] || { echo "::error::Project OIDC token response was empty"; exit 1; }
            echo "::add-mask::$oidc_token"
            export VERCEL_OIDC_TOKEN="$oidc_token"
            export VERCEL_PROJECT_ID="$BROWSER_PROJECT_ID"
            snapshot_id=$(cd apps/game-browser-mcp && node --import tsx scripts/create-browser-snapshot.ts | tail -n 1)
            if [[ ! "$snapshot_id" =~ ^snap_ ]]; then
              echo "::error::Browser snapshot builder did not return a snapshot ID"
              exit 1
            fi
            browser_changed=1
          fi

          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" AGENT_BROWSER_SNAPSHOT_ID "$snapshot_id" plain browser
          upsert_env "$BROWSER_PROJECT_ID" "$browser_env" AGENT_BROWSER_SNAPSHOT_FINGERPRINT "$snapshot_fingerprint" plain browser

          echo "AGENT_BROWSER_SNAPSHOT_ID=$snapshot_id" >> "$GITHUB_ENV"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
          echo "snapshot_fingerprint=$snapshot_fingerprint" >> "$GITHUB_OUTPUT"
          echo "browser_changed=$browser_changed" >> "$GITHUB_OUTPUT"
          echo "action_changed=$action_changed" >> "$GITHUB_OUTPUT"

          rm -f /tmp/browser-env.json /tmp/action-env.json /tmp/env-upsert.json /tmp/oidc.json /tmp/snapshot.json

      - name: Resolve or deploy exact browser Production
        id: browser_deploy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CONFIG_CHANGED: ${{ steps.config.outputs.browser_changed }}
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth="Authorization: Bearer $VERCEL_TOKEN"
          list_url="$api/v6/deployments?projectId=$BROWSER_PROJECT_ID&target=production&limit=20&teamId=$VERCEL_TEAM_ID"
          curl -sS -H "$auth" "$list_url" -o /tmp/browser-deployments.json
          current=$(jq -c '[.deployments[] | select(.target == "production")] | first // null' /tmp/browser-deployments.json)
          current_url=$(jq -r '.url // empty' <<<"$current")
          current_state=$(jq -r '.state // .readyState // empty' <<<"$current")
          current_sha=$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$current")
          current_provenance_ok=0
          if [ -n "$current_url" ]; then
            current_status=$(curl -sS -o /tmp/current-browser-deployment.json -w '%{http_code}' -H "$auth" \
              "$api/v13/deployments/$current_url?teamId=$VERCEL_TEAM_ID&withGitRepoInfo=true")
            if [ "$current_status" = '200' ]; then
              current_ref=$(jq -r '.meta.githubCommitRef // empty' /tmp/current-browser-deployment.json)
              current_source=$(jq -r '.source // empty' /tmp/current-browser-deployment.json)
              current_org=$(jq -r '.meta.githubCommitOrg // .meta.githubOrg // empty' /tmp/current-browser-deployment.json)
              current_repo=$(jq -r '.meta.githubCommitRepo // .meta.githubRepo // empty' /tmp/current-browser-deployment.json)
              if [ "$current_ref" = 'main' ] || { [ "$current_ref" = 'HEAD' ] && [ "$current_source" = 'cli' ]; }; then
                current_provenance_ok=1
              fi
              if [ "$current_org" != "$TARGET_REPOSITORY_OWNER" ] || [ "$current_repo" != "$TARGET_REPOSITORY_NAME" ]; then
                current_provenance_ok=0
              fi
            fi
          fi
          health=$(curl -sS -o /tmp/browser-health-before.json -w '%{http_code}' "$BROWSER_PRODUCTION_URL/healthz" || true)
          need_deploy=0
          if [ "$CONFIG_CHANGED" = '1' ] || [ "$current_state" != 'READY' ] || [ "$current_sha" != "$CANDIDATE_SHA" ] || [ "$current_provenance_ok" != '1' ] || [ "$health" != '200' ]; then
            need_deploy=1
          fi

          if [ "$need_deploy" = '1' ]; then
            export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
            export VERCEL_PROJECT_ID="$BROWSER_PROJECT_ID"
            deployment_url=$(npx -y vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" --cwd "$GITHUB_WORKSPACE" | tail -n 1)
            reused=false
          else
            deployment_url="https://$current_url"
            reused=true
          fi
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::Browser Production URL is invalid"; exit 1; }
          deployment_host=${deployment_url#https://}

          for attempt in $(seq 1 90); do
            status=$(curl -sS -o /tmp/browser-deployment.json -w '%{http_code}' -H "$auth" \
              "$api/v13/deployments/$deployment_host?teamId=$VERCEL_TEAM_ID&withGitRepoInfo=true")
            [ "$status" = '200' ] || { sleep 3; continue; }
            state=$(jq -r '.readyState // .status // .state // empty' /tmp/browser-deployment.json)
            if [ "$state" = 'READY' ]; then break; fi
            if [ "$state" = 'ERROR' ] || [ "$state" = 'CANCELED' ]; then
              echo "::error::Browser Production deployment ended in state $state"
              exit 1
            fi
            sleep 3
          done

          deployment_id=$(jq -r '.id // .uid // empty' /tmp/browser-deployment.json)
          project_id=$(jq -r '.projectId // empty' /tmp/browser-deployment.json)
          target=$(jq -r '.target // empty' /tmp/browser-deployment.json)
          state=$(jq -r '.readyState // .status // .state // empty' /tmp/browser-deployment.json)
          meta_sha=$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' /tmp/browser-deployment.json)
          meta_ref=$(jq -r '.meta.githubCommitRef // empty' /tmp/browser-deployment.json)
          deployment_source=$(jq -r '.source // empty' /tmp/browser-deployment.json)
          meta_org=$(jq -r '.meta.githubCommitOrg // .meta.githubOrg // empty' /tmp/browser-deployment.json)
          meta_repo=$(jq -r '.meta.githubCommitRepo // .meta.githubRepo // empty' /tmp/browser-deployment.json)
          [[ "$deployment_id" =~ ^dpl_ ]] || { echo "::error::Browser deployment ID missing"; exit 1; }
          [ "$project_id" = "$BROWSER_PROJECT_ID" ] || { echo "::error::Browser Production project mismatch"; exit 1; }
          [ "$target" = 'production' ] || { echo "::error::Browser deployment target is not production"; exit 1; }
          [ "$state" = 'READY' ] || { echo "::error::Browser Production deployment is not READY"; exit 1; }
          [ "$meta_sha" = "$CANDIDATE_SHA" ] || { echo "::error::Browser Production Git SHA mismatch"; exit 1; }
          if [ "$meta_ref" = 'main' ]; then
            :
          elif [ "$meta_ref" = 'HEAD' ] && [ "$deployment_source" = 'cli' ]; then
            :
          else
            echo "::error::Browser Production Git provenance is not canonical main"
            exit 1
          fi
          [ "$meta_org" = "$TARGET_REPOSITORY_OWNER" ] && [ "$meta_repo" = "$TARGET_REPOSITORY_NAME" ] || { echo "::error::Browser Production repository provenance mismatch"; exit 1; }

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Require browser stable Production health
        id: browser_health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/browser-health.json -w '%{http_code}' "$BROWSER_PRODUCTION_URL/healthz" || true)
            if [ "$status" = '200' ] && [ "$(jq -r '.ok // false' /tmp/browser-health.json 2>/dev/null || true)" = 'true' ]; then exit 0; fi
            sleep 2
          done
          echo "::error::Browser stable Production health failed (HTTP $status)"
          cat /tmp/browser-health.json 2>/dev/null || true
          exit 1

      - name: Resolve or deploy exact Action Production
        id: action_deploy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CONFIG_CHANGED: ${{ steps.config.outputs.action_changed }}
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth="Authorization: Bearer $VERCEL_TOKEN"
          curl -sS -H "$auth" \
            "$api/v6/deployments?projectId=$ACTION_PROJECT_ID&target=production&limit=20&teamId=$VERCEL_TEAM_ID" \
            -o /tmp/action-deployments.json
          current=$(jq -c '[.deployments[] | select(.target == "production")] | first // null' /tmp/action-deployments.json)
          current_url=$(jq -r '.url // empty' <<<"$current")
          current_state=$(jq -r '.state // .readyState // empty' <<<"$current")
          current_sha=$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$current")
          current_provenance_ok=0
          if [ -n "$current_url" ]; then
            current_status=$(curl -sS -o /tmp/current-action-deployment.json -w '%{http_code}' -H "$auth" \
              "$api/v13/deployments/$current_url?teamId=$VERCEL_TEAM_ID&withGitRepoInfo=true")
            if [ "$current_status" = '200' ]; then
              current_ref=$(jq -r '.meta.githubCommitRef // empty' /tmp/current-action-deployment.json)
              current_source=$(jq -r '.source // empty' /tmp/current-action-deployment.json)
              current_org=$(jq -r '.meta.githubCommitOrg // .meta.githubOrg // empty' /tmp/current-action-deployment.json)
              current_repo=$(jq -r '.meta.githubCommitRepo // .meta.githubRepo // empty' /tmp/current-action-deployment.json)
              if [ "$current_ref" = 'main' ] || { [ "$current_ref" = 'HEAD' ] && [ "$current_source" = 'cli' ]; }; then
                current_provenance_ok=1
              fi
              if [ "$current_org" != "$TARGET_REPOSITORY_OWNER" ] || [ "$current_repo" != "$TARGET_REPOSITORY_NAME" ]; then
                current_provenance_ok=0
              fi
            fi
          fi
          health=$(curl -sS -o /tmp/action-health-before.json -w '%{http_code}' "$ACTION_PRODUCTION_URL/health" || true)
          need_deploy=0
          if [ "$CONFIG_CHANGED" = '1' ] || [ "$current_state" != 'READY' ] || [ "$current_sha" != "$CANDIDATE_SHA" ] || [ "$current_provenance_ok" != '1' ] || [ "$health" != '200' ]; then
            need_deploy=1
          fi

          if [ "$need_deploy" = '1' ]; then
            export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
            export VERCEL_PROJECT_ID="$ACTION_PROJECT_ID"
            deployment_url=$(npx -y vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" --cwd "$GITHUB_WORKSPACE" | tail -n 1)
            reused=false
          else
            deployment_url="https://$current_url"
            reused=true
          fi
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::Action Production URL is invalid"; exit 1; }
          deployment_host=${deployment_url#https://}

          for attempt in $(seq 1 90); do
            status=$(curl -sS -o /tmp/action-deployment.json -w '%{http_code}' -H "$auth" \
              "$api/v13/deployments/$deployment_host?teamId=$VERCEL_TEAM_ID&withGitRepoInfo=true")
            [ "$status" = '200' ] || { sleep 3; continue; }
            state=$(jq -r '.readyState // .status // .state // empty' /tmp/action-deployment.json)
            if [ "$state" = 'READY' ]; then break; fi
            if [ "$state" = 'ERROR' ] || [ "$state" = 'CANCELED' ]; then
              echo "::error::Action Production deployment ended in state $state"
              exit 1
            fi
            sleep 3
          done

          deployment_id=$(jq -r '.id // .uid // empty' /tmp/action-deployment.json)
          project_id=$(jq -r '.projectId // empty' /tmp/action-deployment.json)
          target=$(jq -r '.target // empty' /tmp/action-deployment.json)
          state=$(jq -r '.readyState // .status // .state // empty' /tmp/action-deployment.json)
          meta_sha=$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' /tmp/action-deployment.json)
          meta_ref=$(jq -r '.meta.githubCommitRef // empty' /tmp/action-deployment.json)
          deployment_source=$(jq -r '.source // empty' /tmp/action-deployment.json)
          meta_org=$(jq -r '.meta.githubCommitOrg // .meta.githubOrg // empty' /tmp/action-deployment.json)
          meta_repo=$(jq -r '.meta.githubCommitRepo // .meta.githubRepo // empty' /tmp/action-deployment.json)
          [[ "$deployment_id" =~ ^dpl_ ]] || { echo "::error::Action deployment ID missing"; exit 1; }
          [ "$project_id" = "$ACTION_PROJECT_ID" ] || { echo "::error::Action Production project mismatch"; exit 1; }
          [ "$target" = 'production' ] || { echo "::error::Action deployment target is not production"; exit 1; }
          [ "$state" = 'READY' ] || { echo "::error::Action Production deployment is not READY"; exit 1; }
          [ "$meta_sha" = "$CANDIDATE_SHA" ] || { echo "::error::Action Production Git SHA mismatch"; exit 1; }
          if [ "$meta_ref" = 'main' ]; then
            :
          elif [ "$meta_ref" = 'HEAD' ] && [ "$deployment_source" = 'cli' ]; then
            :
          else
            echo "::error::Action Production Git provenance is not canonical main"
            exit 1
          fi
          [ "$meta_org" = "$TARGET_REPOSITORY_OWNER" ] && [ "$meta_repo" = "$TARGET_REPOSITORY_NAME" ] || { echo "::error::Action Production repository provenance mismatch"; exit 1; }

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Verify stable Action Production health
        id: action_health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health=$(curl -sS -o /tmp/action-health.json -w '%{http_code}' "$ACTION_PRODUCTION_URL/health" || true)
            if [ "$health" = '200' ] && [ "$(jq -r '.ok // false' /tmp/action-health.json 2>/dev/null || true)" = 'true' ]; then exit 0; fi
            sleep 2
          done
          echo "::error::Action stable health failed (HTTP $health)"
          cat /tmp/action-health.json 2>/dev/null || true
          exit 1

      - name: Verify Action Production OpenAPI contract
        id: action_openapi
        shell: bash
        run: |
          set -euo pipefail
          openapi=$(curl -sS -o /tmp/openapi.json -w '%{http_code}' "$ACTION_PRODUCTION_URL/openapi.json")
          [ "$openapi" = '200' ] || { echo "::error::Action OpenAPI failed"; exit 1; }
          for operation in \
            startGameQaSession observeGameQaSession sendGameQaInput \
            readGameQaState resetGameQaSession endGameQaSession; do
            jq -e --arg operation "$operation" '[.paths[] | .post? | select(.operationId == $operation)] | length == 1' /tmp/openapi.json >/dev/null || {
              echo "::error::OpenAPI is missing $operation"
              exit 1
            }
          done
          jq -e '[.paths[] | .get?, .post?, .put? | select(.operationId == "getCanonicalSkill" or .operationId == "getRepositoryState")] | length >= 2' /tmp/openapi.json >/dev/null || {
            echo "::error::Existing canonical-skill/GitHub control operations are missing"
            exit 1
          }

      - name: Register exact browser Production deployment
        id: registration
        shell: bash
        working-directory: apps/game-browser-mcp
        env:
          REMOTE_RUNTIME_BASE_URL: ${{ env.BROWSER_PRODUCTION_URL }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.browser_deploy.outputs.deployment_id }}
          EXPECTED_COMMIT_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
          export VERCEL_PROJECT_ID="$BROWSER_PROJECT_ID"
          npx -y vercel@59.1.4 env run --environment production \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" -- \
            node --import tsx scripts/register-vercel-deployment.ts

      - name: Issue short-lived Production acceptance principal
        id: principal
        shell: bash
        working-directory: apps/game-browser-mcp
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
          export VERCEL_PROJECT_ID="$BROWSER_PROJECT_ID"
          npx -y vercel@59.1.4 env run --environment production \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" -- \
            node --import tsx scripts/issue-test-principal.ts

      - name: Run provider-backed Production Canvas gameplay acceptance
        id: gameplay
        shell: bash
        working-directory: apps/game-browser-mcp
        env:
          REMOTE_MCP_URL: ${{ env.BROWSER_PRODUCTION_URL }}/mcp
          REMOTE_MCP_BEARER_TOKEN: ${{ steps.principal.outputs.bearer_token }}
          TARGET_REGISTRATION_ID: ${{ steps.registration.outputs.target_registration_id }}
          EXPECTED_COMMIT_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          REMOTE_EVIDENCE_PATH: ${{ github.workspace }}/apps/game-browser-mcp/remote-acceptance-evidence.json
        run: npm run test:remote

      - name: Run bounded Action-to-browser bridge smoke
        id: bridge
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          cat > /tmp/bridge-smoke.sh <<'BRIDGE_SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail
          candidate_sha="$1"
          action_url="$2"
          browser_url="$3"
          if [ -z "${UAL_ACTION_API_KEY:-}" ]; then
            echo "::error::Vercel Production environment did not inject UAL_ACTION_API_KEY"
            exit 1
          fi
          echo "::add-mask::$UAL_ACTION_API_KEY"
          session_id=''
          cleanup() {
            if [ -z "$session_id" ]; then return 0; fi
            curl -sS -o /tmp/bridge-cleanup.json \
              -X POST "$action_url/game-browser/session-end" \
              -H "Authorization: Bearer $UAL_ACTION_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg session "$session_id" '{sessionId:$session}')" \
              >/dev/null || true
          }
          trap cleanup EXIT

          start_status=$(curl -sS -o /tmp/bridge-start.json -w '%{http_code}' \
            -X POST "$action_url/game-browser/session-start" \
            -H "Authorization: Bearer $UAL_ACTION_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg sha "$candidate_sha" '{expectedCommitSha:$sha,viewport:{width:1280,height:720}}')")
          if [ "$start_status" != '200' ]; then
            echo "::error::Bridge session start failed (HTTP $start_status)"
            jq -r '.error // empty, .message // empty' /tmp/bridge-start.json || true
            exit 1
          fi
          session_id=$(jq -r '.session_id // empty' /tmp/bridge-start.json)
          [ -n "$session_id" ] || { echo "::error::Bridge session start returned no session_id"; exit 1; }
          echo "::add-mask::$session_id"

          observe_status=$(curl -sS -o /tmp/bridge-observe.json -w '%{http_code}' \
            -X POST "$action_url/game-browser/observe" \
            -H "Authorization: Bearer $UAL_ACTION_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg session "$session_id" '{sessionId:$session}')")
          [ "$observe_status" = '200' ] || { echo "::error::Bridge observe failed (HTTP $observe_status)"; exit 1; }
          [ "$(jq -r '.session_id // empty' /tmp/bridge-observe.json)" = "$session_id" ] || { echo "::error::Bridge observe session mismatch"; exit 1; }
          screenshot_url=$(jq -r '.. | objects | select(has("screenshot")) | .screenshot | select(.available == true and .transported == true and .mime_type == "image/png") | .screenshot_url // empty' /tmp/bridge-observe.json | head -n1)
          frame_sha256=$(jq -r '.. | objects | select(has("screenshot")) | .screenshot | select(.available == true and .transported == true and .mime_type == "image/png") | .frame_sha256 // empty' /tmp/bridge-observe.json | head -n1)
          [ -n "$screenshot_url" ] || { echo "::error::Bridge observe returned no signed screenshot URL"; exit 1; }
          [[ "$frame_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Bridge observe returned invalid screenshot frame digest"; exit 1; }
          case "$screenshot_url" in
            "$browser_url"/internal/gpt-action/screenshot\?*) ;;
            *) echo "::error::Bridge screenshot URL escaped the stable browser origin"; exit 1 ;;
          esac
          echo "::add-mask::$screenshot_url"
          image_meta=$(curl -sS -o /tmp/bridge-screenshot.png -w '%{http_code} %{content_type}' "$screenshot_url")
          image_status=${image_meta%% *}
          image_type=${image_meta#* }
          [ "$image_status" = '200' ] || { echo "::error::Signed screenshot fetch failed (HTTP $image_status)"; exit 1; }
          [ "$image_type" = 'image/png' ] || { echo "::error::Signed screenshot fetch returned unexpected content type"; exit 1; }
          [ -s /tmp/bridge-screenshot.png ] || { echo "::error::Signed screenshot fetch returned an empty image"; exit 1; }
          actual_frame_sha256=$(sha256sum /tmp/bridge-screenshot.png | awk '{print $1}')
          [ "$actual_frame_sha256" = "$frame_sha256" ] || { echo "::error::Signed screenshot bytes did not match the observed frame digest"; exit 1; }

          end_status=$(curl -sS -o /tmp/bridge-end.json -w '%{http_code}' \
            -X POST "$action_url/game-browser/session-end" \
            -H "Authorization: Bearer $UAL_ACTION_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg session "$session_id" '{sessionId:$session}')")
          [[ "$end_status" =~ ^20[0-9]$ ]] || { echo "::error::Bridge session end failed (HTTP $end_status)"; exit 1; }
          session_id=''
          trap - EXIT
          BRIDGE_SMOKE
          chmod 700 /tmp/bridge-smoke.sh
          export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
          export VERCEL_PROJECT_ID="$ACTION_PROJECT_ID"
          npx -y vercel@59.1.4 env run --environment production \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" -- \
            /tmp/bridge-smoke.sh "$CANDIDATE_SHA" "$ACTION_PRODUCTION_URL" "$BROWSER_PRODUCTION_URL"

      - name: Record non-secret reconciliation evidence
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          BROWSER_DEPLOYMENT_ID: ${{ steps.browser_deploy.outputs.deployment_id }}
          ACTION_DEPLOYMENT_ID: ${{ steps.action_deploy.outputs.deployment_id }}
          BROWSER_REUSED: ${{ steps.browser_deploy.outputs.reused }}
          ACTION_REUSED: ${{ steps.action_deploy.outputs.reused }}
          SNAPSHOT_FINGERPRINT: ${{ steps.config.outputs.snapshot_fingerprint }}
          BROWSER_HEALTH_OUTCOME: ${{ steps.browser_health.outcome }}
          ACTION_HEALTH_OUTCOME: ${{ steps.action_health.outcome }}
          ACTION_OPENAPI_OUTCOME: ${{ steps.action_openapi.outcome }}
          GAMEPLAY_OUTCOME: ${{ steps.gameplay.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
        run: |
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg browserDeploymentId "$BROWSER_DEPLOYMENT_ID" \
            --arg actionDeploymentId "$ACTION_DEPLOYMENT_ID" \
            --arg browserReused "$BROWSER_REUSED" \
            --arg actionReused "$ACTION_REUSED" \
            --arg snapshotFingerprint "$SNAPSHOT_FINGERPRINT" \
            --arg browserUrl "$BROWSER_PRODUCTION_URL" \
            --arg actionUrl "$ACTION_PRODUCTION_URL" \
            --arg browserHealthOutcome "$BROWSER_HEALTH_OUTCOME" \
            --arg actionHealthOutcome "$ACTION_HEALTH_OUTCOME" \
            --arg actionOpenApiOutcome "$ACTION_OPENAPI_OUTCOME" \
            --arg gameplayOutcome "$GAMEPLAY_OUTCOME" \
            --arg bridgeOutcome "$BRIDGE_OUTCOME" \
            '{
              candidateSha:$candidateSha,
              browserDeploymentId:$browserDeploymentId,
              actionDeploymentId:$actionDeploymentId,
              browserDeploymentReused:($browserReused == "true"),
              actionDeploymentReused:($actionReused == "true"),
              snapshotFingerprint:$snapshotFingerprint,
              browserStableUrl:$browserUrl,
              actionStableUrl:$actionUrl,
              browserHealthOutcome:$browserHealthOutcome,
              actionHealthOutcome:$actionHealthOutcome,
              actionOpenApiOutcome:$actionOpenApiOutcome,
              gameplayOutcome:$gameplayOutcome,
              bridgeOutcome:$bridgeOutcome,
              managedBy:"production-runtime-reconcile",
              secretsIncluded:false
            }' > "$EVIDENCE_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-runtime-reconcile-${{ steps.candidate.outputs.candidate_sha }}
          path: |
            production-runtime-reconcile-evidence.json
            apps/game-browser-mcp/remote-acceptance-evidence.json
          if-no-files-found: warn
          retention-days: 7