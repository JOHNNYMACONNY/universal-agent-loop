name: game-browser-snapshot-cleanup

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/game-browser-snapshot-cleanup.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TEAM_ID: team_3LfEMNVsAEbXKLoCrnzXQzrF
      VERCEL_PROJECT_ID: prj_bU062HqgwiUYUtMuX4nRN0GpXRd9
    steps:
      - name: Verify dedicated-project snapshot cleanup
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

          list_snapshots() {
            curl -sS -o "$1" -w '%{http_code}' \
              "https://api.vercel.com/v2/sandboxes/snapshots?project=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=50&sortOrder=asc" \
              -H "Authorization: Bearer $VERCEL_TOKEN"
          }

          for attempt in 1 2 3 4 5 6; do
            status=$(list_snapshots /tmp/snapshots.json)
            if [ "$status" != "200" ]; then
              echo "::error::Unable to list dedicated-project Sandbox snapshots (HTTP $status)"
              jq -r '.error.code // empty, .error.message // empty' /tmp/snapshots.json || true
              exit 1
            fi
            remaining=$(jq -r '
              def rows:
                if (.snapshots? | type) == "array" then .snapshots
                elif (.data?.snapshots? | type) == "array" then .data.snapshots
                elif (.data? | type) == "array" then .data
                else [] end;
              [rows[] | select((.status // "created") != "deleted")] | length
            ' /tmp/snapshots.json)
            echo "Snapshot cleanup visibility attempt $attempt: remaining=$remaining"
            if [ "$remaining" = "0" ]; then
              echo "SNAPSHOT_CLEANUP=PASS remaining=0"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Dedicated-project snapshot deletions have not become visible yet"
          jq -r '
            def rows:
              if (.snapshots? | type) == "array" then .snapshots
              elif (.data?.snapshots? | type) == "array" then .data.snapshots
              elif (.data? | type) == "array" then .data
              else [] end;
            rows[] | "SNAPSHOT \(.id) status=\(.status // "unknown") size=\(.sizeBytes // 0)"
          ' /tmp/snapshots.json
          exit 1
