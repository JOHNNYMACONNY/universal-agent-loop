name: game-browser-snapshot-cleanup

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/game-browser-snapshot-cleanup.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TEAM_ID: team_3LfEMNVsAEbXKLoCrnzXQzrF
      VERCEL_PROJECT_ID: prj_bU062HqgwiUYUtMuX4nRN0GpXRd9
    steps:
      - name: Delete obsolete dedicated-project snapshots
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

          list_snapshots() {
            curl -sS -o "$1" -w '%{http_code}' \
              "https://api.vercel.com/v2/sandboxes/snapshots?project=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=50&sortOrder=asc" \
              -H "Authorization: Bearer $VERCEL_TOKEN"
          }

          status=$(list_snapshots /tmp/snapshots.json)
          if [ "$status" != "200" ]; then
            echo "::error::Unable to list dedicated-project Sandbox snapshots (HTTP $status)"
            jq -r '.error.code // empty, .error.message // empty' /tmp/snapshots.json || true
            exit 1
          fi

          jq -r '
            if (.snapshots? | type) == "array" then .snapshots[]?.id
            elif (.data?.snapshots? | type) == "array" then .data.snapshots[]?.id
            elif (.data? | type) == "array" then .data[]?.id
            else empty end
          ' /tmp/snapshots.json > /tmp/snapshot-ids.txt

          count=$(grep -c '^snap_' /tmp/snapshot-ids.txt || true)
          echo "Deleting $count obsolete snapshots from dedicated project"
          while IFS= read -r snapshot_id; do
            [ -z "$snapshot_id" ] && continue
            [[ "$snapshot_id" =~ ^snap_[A-Za-z0-9]+$ ]] || { echo "::error::Unexpected snapshot ID"; exit 1; }
            delete_status=$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE "https://api.vercel.com/v2/sandboxes/snapshots/$snapshot_id?teamId=$VERCEL_TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN")
            if [ "$delete_status" != "200" ]; then
              echo "::error::Failed to delete $snapshot_id (HTTP $delete_status)"
              jq -r '.error.code // empty, .error.message // empty' /tmp/delete.json || true
              exit 1
            fi
            echo "Deleted $snapshot_id"
          done < /tmp/snapshot-ids.txt

          verify_status=$(list_snapshots /tmp/verify.json)
          test "$verify_status" = "200"
          remaining=$(jq -r '
            if (.snapshots? | type) == "array" then (.snapshots|length)
            elif (.data?.snapshots? | type) == "array" then (.data.snapshots|length)
            elif (.data? | type) == "array" then (.data|length)
            else 0 end
          ' /tmp/verify.json)
          if [ "$remaining" != "0" ]; then
            echo "::error::$remaining dedicated-project snapshots remain after cleanup"
            exit 1
          fi
          echo "SNAPSHOT_CLEANUP=PASS deleted=$count remaining=0"
