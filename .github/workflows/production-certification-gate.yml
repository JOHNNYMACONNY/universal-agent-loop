name: production-certification-gate

on:
  workflow_run:
    workflows: ['production-runtime-reconcile']
    types: [completed]

permissions:
  contents: write
  statuses: read

concurrency:
  group: production-certification-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact reconciliation evidence and promote immutable certification tag
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.head_branch !== 'main') {
              core.setFailed('Refusing to certify a non-main Production reconciliation');
              return;
            }
            if (run.conclusion !== 'success') {
              core.setFailed('Refusing to certify an unsuccessful Production reconciliation');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(String(run.head_sha ?? ''))) {
              core.setFailed('Production reconciliation did not provide an exact commit SHA');
              return;
            }

            const expectedTarget = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            let matched = null;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: run.head_sha,
                per_page: 100,
              });
              matched = statuses.find((status) =>
                status.context === 'production-runtime-reconcile' &&
                status.state === 'success' &&
                status.target_url === expectedTarget
              ) ?? null;
              if (matched) break;
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }

            if (!matched) {
              core.setFailed(`Exact Production reconciliation status for run ${run.id} was not observed on ${run.head_sha}`);
              return;
            }

            const tag = `production-certified-${run.head_sha}`;
            let existing = null;
            try {
              existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/production-certified-${run.head_sha}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              if (existing.data.object.sha !== run.head_sha) {
                core.setFailed(`Certification tag ${tag} exists but does not point to the reconciled SHA`);
                return;
              }
              core.info(`Certification tag ${tag} already exists at the exact reconciled SHA`);
              return;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/production-certified-${run.head_sha}`,
              sha: run.head_sha,
            });
            core.info(`Certified exact Production SHA ${run.head_sha} as ${tag}`);
