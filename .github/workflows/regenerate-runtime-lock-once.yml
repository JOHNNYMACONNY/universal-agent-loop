name: regenerate-runtime-lock-once

on:
  push:
    branches: [chatgpt/autonomous-dev-loop]
    paths:
      - .github/workflows/regenerate-runtime-lock-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/autonomous-dev-loop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix apps/game-browser-mcp --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/game-browser-mcp/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: regenerate Vercel-only runtime lockfile"
          git push origin HEAD:chatgpt/autonomous-dev-loop
