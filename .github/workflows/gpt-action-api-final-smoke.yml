name: gpt-action-api-final-smoke

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  verify-production:
    if: >-
      github.actor == 'JOHNNYMACONNY' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/gpt-action-production-final-verify' &&
      contains(github.event.pull_request.body || '', '[run-final-production-verify]')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_3LfEMNVsAEbXKLoCrnzXQzrF
      VERCEL_PROJECT_ID: prj_80jo2dodxOmSSvX6muUc7Tc7wIo1
      PRODUCTION_URL: https://ual-gpt-action-api.vercel.app
    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "::error::VERCEL_TOKEN is required"; exit 1; }

      - name: Resolve masked active Action key across all scopes
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth="Authorization: Bearer $VERCEL_TOKEN"
          status=$(curl -sS -o /tmp/project-env.json -w '%{http_code}' -H "$auth" \
            "$api/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_TEAM_ID")
          [ "$status" = '200' ] || { echo "::error::Unable to read Vercel environment variables (HTTP $status)"; exit 1; }

          jq -c '
            [.envs[] | select(.key == "UAL_ACTION_API_KEY")]
            | sort_by(.updatedAt // .createdAt // 0)
            | .[]
            | {
                id:(.id // ""),
                target:(.target // []),
                gitBranch:(.gitBranch // ""),
                type:(.type // ""),
                updatedAt:(.updatedAt // .createdAt // 0),
                value:(.value // "")
              }
          ' /tmp/project-env.json > /tmp/action-keys.jsonl

          key_count=$(wc -l < /tmp/action-keys.jsonl | tr -d ' ')
          [ "$key_count" -gt 0 ] || { echo "::error::No UAL_ACTION_API_KEY records were found"; exit 1; }
          echo "Found $key_count Action key record(s) across all scopes; values remain masked."

          match_index=''
          match_status=''
          index=0
          while IFS= read -r record; do
            index=$((index + 1))
            value=$(printf '%s' "$record" | jq -r '.value')
            target=$(printf '%s' "$record" | jq -c '.target')
            branch=$(printf '%s' "$record" | jq -r '.gitBranch')
            kind=$(printf '%s' "$record" | jq -r '.type')
            updated=$(printf '%s' "$record" | jq -r '.updatedAt')
            echo "Record $index metadata: target=$target branch=${branch:-<global>} type=$kind updatedAt=$updated"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            status=$(curl -sS -o /tmp/candidate-skill.json -w '%{http_code}' \
              -H "Authorization: Bearer $value" \
              "$PRODUCTION_URL/skills/autonomous-dev-loop")
            echo "Record $index protected-endpoint status: $status"
            if [ "$status" = '200' ] || [ "$status" = '502' ] || [ "$status" = '503' ]; then
              match_index="$index"
              match_status="$status"
              echo "PRODUCTION_ACTION_KEY=$value" >> "$GITHUB_ENV"
              cp /tmp/candidate-skill.json /tmp/skill.json
              break
            fi
          done < /tmp/action-keys.jsonl

          [ -n "$match_index" ] || { echo "::error::No stored UAL_ACTION_API_KEY matches the deployed function"; exit 1; }
          echo "Deployed Action key matches record index $match_index of $key_count; protected endpoint returned HTTP $match_status."
          echo "ACTIVE_KEY_INDEX=$match_index" >> "$GITHUB_ENV"
          echo "ACTION_KEY_COUNT=$key_count" >> "$GITHUB_ENV"
          echo "MATCH_STATUS=$match_status" >> "$GITHUB_ENV"
          rm -f /tmp/project-env.json /tmp/action-keys.jsonl /tmp/candidate-skill.json

      - name: Verify stable Production Action end to end
        shell: bash
        run: |
          set -euo pipefail

          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$PRODUCTION_URL/health")
          [ "$status" = '200' ] && [ "$(jq -r '.ok // false' /tmp/health.json)" = 'true' ] || { echo "::error::Health failed (HTTP $status)"; exit 1; }

          status=$(curl -sS -o /tmp/openapi.json -w '%{http_code}' "$PRODUCTION_URL/openapi.json")
          [ "$status" = '200' ] || { echo "::error::OpenAPI failed (HTTP $status)"; exit 1; }
          [ "$(jq -r '.openapi' /tmp/openapi.json)" = '3.1.0' ] || exit 1
          [ "$(jq -r '.servers[0].url' /tmp/openapi.json)" = "$PRODUCTION_URL" ] || exit 1
          [ "$(jq -r '.paths["/skills/{name}"].get.operationId' /tmp/openapi.json)" = 'getCanonicalSkill' ] || exit 1
          [ "$(jq -r '.components.schemas.SkillResponse.type' /tmp/openapi.json)" = 'object' ] || exit 1

          status=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' "$PRODUCTION_URL/skills/autonomous-dev-loop")
          [ "$status" = '401' ] || { echo "::error::Missing bearer was not rejected (HTTP $status)"; exit 1; }

          status=$(curl -sS -o /tmp/skill.json -w '%{http_code}' \
            -H "Authorization: Bearer $PRODUCTION_ACTION_KEY" \
            "$PRODUCTION_URL/skills/autonomous-dev-loop")
          [ "$status" = '200' ] || { echo "::error::Authenticated canonical skill retrieval failed (HTTP $status)"; exit 1; }
          [ "$(jq -r '.repository' /tmp/skill.json)" = 'JOHNNYMACONNY/universal-agent-loop' ] || exit 1
          [ "$(jq -r '.ref' /tmp/skill.json)" = 'main' ] || exit 1
          [ "$(jq -r '.path' /tmp/skill.json)" = 'skills/autonomous-dev-loop/SKILL.md' ] || exit 1
          jq -e '.blobSha | type == "string" and length == 40' /tmp/skill.json >/dev/null || exit 1
          jq -e '.content | contains("# Autonomous Dev Loop")' /tmp/skill.json >/dev/null || exit 1

          jq -n \
            --arg stableUrl "$PRODUCTION_URL" \
            --arg blobSha "$(jq -r '.blobSha' /tmp/skill.json)" \
            --arg activeKeyIndex "$ACTIVE_KEY_INDEX" \
            --arg actionKeyCount "$ACTION_KEY_COUNT" \
            '{stableUrl:$stableUrl,health:true,openapi:true,unauthorizedRejected:true,canonicalSkillRetrieved:true,blobSha:$blobSha,activeKeyIndex:($activeKeyIndex|tonumber),actionKeyCount:($actionKeyCount|tonumber)}' \
            > gpt-action-final-smoke-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-action-final-smoke-${{ github.event.pull_request.head.sha }}
          path: gpt-action-final-smoke-evidence.json
          if-no-files-found: ignore
