name: gpt-action-api-key-align

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  align-and-verify:
    if: >-
      github.actor == 'JOHNNYMACONNY' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/gpt-action-production-key-align' &&
      contains(github.event.pull_request.body || '', '[run-production-key-align]')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_3LfEMNVsAEbXKLoCrnzXQzrF
      VERCEL_TEAM_SLUG: johnny-maconnys-projects
      VERCEL_PROJECT_ID: prj_80jo2dodxOmSSvX6muUc7Tc7wIo1
      SOURCE_BRANCH: chatgpt/gpt-action-api-step-3a
      PRODUCTION_URL: https://ual-gpt-action-api.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve saved GPT Action key and align Production
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth="Authorization: Bearer $VERCEL_TOKEN"
          status=$(curl -sS -o /tmp/env.json -w '%{http_code}' -H "$auth" \
            "$api/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_TEAM_ID")
          [ "$status" = '200' ] || { echo "::error::Unable to read Vercel env (HTTP $status)"; exit 1; }

          source_key=$(jq -r --arg branch "$SOURCE_BRANCH" '
            [.envs[]
              | select(
                  .key == "UAL_ACTION_API_KEY"
                  and (.gitBranch // "") == $branch
                  and ((.target // []) | index("preview"))
                )
            ]
            | sort_by(.updatedAt // .createdAt // 0) | last
            | .value // empty
          ' /tmp/env.json)
          [ -n "$source_key" ] || { echo "::error::Saved branch-scoped GPT Action key was not found"; exit 1; }
          echo "::add-mask::$source_key"

          body=$(jq -n --arg value "$source_key" '{key:"UAL_ACTION_API_KEY",value:$value,type:"encrypted",target:["production"]}')
          promote_status=$(curl -sS -o /tmp/upsert.json -w '%{http_code}' -X POST \
            "$api/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            -H "$auth" -H 'Content-Type: application/json' --data "$body")
          [ "$promote_status" = '200' ] || [ "$promote_status" = '201' ] || { echo "::error::Unable to align Production Action key (HTTP $promote_status)"; exit 1; }
          echo "SAVED_GPT_ACTION_KEY=$source_key" >> "$GITHUB_ENV"
          rm -f /tmp/env.json /tmp/upsert.json

      - name: Deploy current main with aligned Production environment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha=$(git rev-parse HEAD)
          export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
          export VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID"
          deployment_url=$(npx -y vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" --cwd "$GITHUB_WORKSPACE" | tail -n 1)
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo "::error::Vercel did not return a Production URL"; exit 1; }
          deployment_host=${deployment_url#https://}
          for attempt in $(seq 1 60); do
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_TEAM_ID&withGitRepoInfo=true" \
              -o /tmp/deployment.json
            state=$(jq -r '.readyState // .status // .state // empty' /tmp/deployment.json)
            [ "$state" = 'READY' ] && break
            [ "$state" != 'ERROR' ] && [ "$state" != 'CANCELED' ] || { echo "::error::Production deployment failed"; exit 1; }
            sleep 3
          done
          [ "$(jq -r '.readyState // .status // .state // empty' /tmp/deployment.json)" = 'READY' ] || exit 1
          [ "$(jq -r '.target // empty' /tmp/deployment.json)" = 'production' ] || exit 1
          [ "$(jq -r '.projectId // empty' /tmp/deployment.json)" = "$VERCEL_PROJECT_ID" ] || exit 1
          meta_sha=$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' /tmp/deployment.json)
          [ -z "$meta_sha" ] || [ "$meta_sha" = "$candidate_sha" ] || exit 1
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(jq -r '.id // .uid // empty' /tmp/deployment.json)" >> "$GITHUB_OUTPUT"

      - name: Verify saved GPT key against stable Production API
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$PRODUCTION_URL/health")
          [ "$status" = '200' ] || exit 1
          status=$(curl -sS -o /tmp/openapi.json -w '%{http_code}' "$PRODUCTION_URL/openapi.json")
          [ "$status" = '200' ] && [ "$(jq -r '.servers[0].url' /tmp/openapi.json)" = "$PRODUCTION_URL" ] || exit 1
          status=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$PRODUCTION_URL/skills/autonomous-dev-loop")
          [ "$status" = '401' ] || exit 1
          status=$(curl -sS -o /tmp/skill.json -w '%{http_code}' -H "Authorization: Bearer $SAVED_GPT_ACTION_KEY" "$PRODUCTION_URL/skills/autonomous-dev-loop")
          [ "$status" = '200' ] || { echo "::error::Saved GPT key failed Production authentication (HTTP $status)"; exit 1; }
          [ "$(jq -r '.repository' /tmp/skill.json)" = 'JOHNNYMACONNY/universal-agent-loop' ] || exit 1
          [ "$(jq -r '.ref' /tmp/skill.json)" = 'main' ] || exit 1
          [ "$(jq -r '.path' /tmp/skill.json)" = 'skills/autonomous-dev-loop/SKILL.md' ] || exit 1
          jq -e '.content | contains("# Autonomous Dev Loop")' /tmp/skill.json >/dev/null || exit 1
          jq -n --arg candidateSha "${{ steps.deploy.outputs.candidate_sha }}" --arg deploymentId "${{ steps.deploy.outputs.deployment_id }}" --arg blobSha "$(jq -r '.blobSha' /tmp/skill.json)" '{candidateSha:$candidateSha,deploymentId:$deploymentId,stableUrl:"https://ual-gpt-action-api.vercel.app",savedGptKeyAuthenticated:true,canonicalSkillRetrieved:true,blobSha:$blobSha}' > gpt-action-key-align-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-action-key-align-${{ github.event.pull_request.head.sha }}
          path: gpt-action-key-align-evidence.json
          if-no-files-found: ignore
