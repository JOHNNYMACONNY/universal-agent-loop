name: apply-mcp-image-review-repair

on:
  push:
    branches:
      - chatgpt/autonomous-dev-loop

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/autonomous-dev-loop
      - name: Patch bounded MCP image transport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/game-browser-mcp/src/mcp.ts')
          s = p.read_text()
          s = s.replace("import { asRuntimeError } from './errors.js';", "import { asRuntimeError, RuntimeError } from './errors.js';")
          old = """function result(value: unknown) {\n  return { content: [{ type: 'text' as const, text: JSON.stringify(value) }] };\n}\n"""
          new = """const MAX_SCREENSHOT_BYTES = 2_000_000;\n\nfunction result(value: unknown) {\n  const structured = structuredClone(value as any);\n  const container = structured && typeof structured === 'object'\n    ? ((structured as any).observation && typeof (structured as any).observation === 'object' ? (structured as any).observation : structured as any)\n    : undefined;\n  const screenshot = container?.screenshot;\n  let image: { type: 'image'; data: string; mimeType: string } | undefined;\n  if (screenshot && typeof screenshot === 'object' && typeof screenshot.base64 === 'string') {\n    const bytes = Buffer.from(screenshot.base64, 'base64');\n    if (bytes.byteLength > MAX_SCREENSHOT_BYTES) {\n      throw new RuntimeError('LIMIT_EXCEEDED', 'screenshot exceeds 2 MB MCP image limit');\n    }\n    image = { type: 'image', data: screenshot.base64, mimeType: 'image/png' };\n    container.screenshot = {\n      content_ref: 'mcp:image:1',\n      mime_type: 'image/png',\n      content_trust: 'UNTRUSTED_TARGET_CONTENT',\n    };\n  }\n  return {\n    content: [\n      { type: 'text' as const, text: JSON.stringify(structured) },\n      ...(image ? [image] : []),\n    ],\n  };\n}\n"""
          if old not in s:
              raise SystemExit('mcp result() anchor missing')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/apply-mcp-image-review-repair.yml
      - name: Commit reviewed MCP image repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game-browser-mcp/src/mcp.ts .github/workflows/apply-mcp-image-review-repair.yml
          git commit -m "fix: return bounded screenshots as MCP image evidence"
          git push origin HEAD:chatgpt/autonomous-dev-loop
